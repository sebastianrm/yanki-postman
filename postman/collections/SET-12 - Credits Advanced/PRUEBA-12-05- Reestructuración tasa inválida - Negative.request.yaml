$kind: http-request
name: 'PRUEBA-12-05: Reestructuración tasa inválida - Negative'
order: 5000
method: PUT
url: '{{base_url}}/api/credits/{{credit_id}}'
headers:
  - key: Authorization
    value: 'Bearer {{auth_token}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
        "interestRate": 60.0
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: 'pm.test("Status code is 400", function () { pm.response.to.have.status(400); });'
