$kind: http-request
name: 'PRUEBA-12-06: Cancelación crédito - Happy Path'
order: 6000
method: DELETE
url: '{{base_url}}/api/credits/{{credit_id}}'
headers:
  - key: Authorization
    value: 'Bearer {{auth_token}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: 'pm.test("Status code is 200", function () { pm.response.to.have.status(200); });'
