$kind: http-request
name: 'PRUEBA-04-01: Listar tarjetas - Happy Path'
order: 1000
method: GET
url: '{{base_url}}/api/cards?customerId={{customer_id}}'
queryParams:
  - key: customerId
    value: '{{customer_id}}'
headers:
  - key: Authorization
    value: 'Bearer {{auth_token}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: 'pm.test("Status code is 200", function () { pm.response.to.have.status(200); });'
