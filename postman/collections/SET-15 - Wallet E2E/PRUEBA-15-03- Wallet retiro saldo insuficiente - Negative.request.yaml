$kind: http-request
name: 'PRUEBA-15-03: Wallet retiro saldo insuficiente - Negative'
order: 3000
method: POST
url: '{{base_url}}/api/wallets/{{wallet_id}}/withdrawals'
headers:
  - key: Authorization
    value: 'Bearer {{auth_token}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
        "amount": 999999.0,
        "destinationAccountId": "000000000000000000000000"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: 'pm.test("Status code is 400 or 409", function () { pm.expect(pm.response.code).to.be.oneOf([400, 409]); });'
