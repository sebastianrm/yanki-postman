$kind: http-request
name: 'PRUEBA-15-02: Wallet P2P destino inexistente - Negative'
order: 2000
method: POST
url: '{{base_url}}/api/wallets/{{wallet_id}}/payments'
headers:
  - key: Authorization
    value: 'Bearer {{auth_token}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
        "phoneDestino": "+51999000000",
        "amount": 100.0,
        "description": "P2P inexistente"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: 'pm.test("Status code is 404", function () { pm.response.to.have.status(404); });'
