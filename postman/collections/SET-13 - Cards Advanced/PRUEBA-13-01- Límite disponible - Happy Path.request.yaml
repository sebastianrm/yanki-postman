$kind: http-request
name: 'PRUEBA-13-01: Límite disponible - Happy Path'
order: 1000
method: GET
url: '{{base_url}}/api/cards/{{card_id}}/limit'
headers:
  - key: Authorization
    value: 'Bearer {{auth_token}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: 'pm.test("Status code is 200", function () { pm.response.to.have.status(200); });'
