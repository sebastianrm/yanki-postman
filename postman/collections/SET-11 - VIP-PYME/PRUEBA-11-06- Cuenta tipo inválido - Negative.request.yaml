$kind: http-request
name: 'PRUEBA-11-06: Cuenta tipo inválido - Negative'
order: 6000
method: POST
url: '{{base_url}}/api/accounts'
headers:
  - key: Authorization
    value: 'Bearer {{auth_token}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
        "customerId": "{{customer_id}}",
        "accountType": "INVALID_TYPE",
        "initialAmount": 100.0,
        "currency": "PEN"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: 'pm.test("Status code is 400 or 422", function () { pm.expect(pm.response.code).to.be.oneOf([400, 422]); });'
