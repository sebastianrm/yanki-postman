$kind: http-request
name: 'PRUEBA-16-05: Gateway validación token - Happy Path'
order: 5000
method: GET
url: '{{base_url}}/api/customers?page=0&size=1'
queryParams:
  - key: page
    value: '0'
  - key: size
    value: '1'
headers:
  - key: Authorization
    value: 'Bearer {{auth_token}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: 'pm.test("Status code is 200", function () { pm.response.to.have.status(200); });'
