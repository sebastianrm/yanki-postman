$kind: http-request
name: 'PRUEBA-16-04: Logout token inválido - Negative'
order: 4000
method: POST
url: '{{base_url}}/api/auth/logout'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
        "refreshToken": "invalid_token"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: 'pm.test("Status code is 400 or 401", function () { pm.expect(pm.response.code).to.be.oneOf([400, 401]); });'
