$kind: http-request
name: "PRUEBA-03-06: Cuenta inexistente - Negative"
description: |-
  Intenta consultar una cuenta con un ID que no existe en el sistema. Debe retornar 404 Not Found.

  **Endpoint:** GET /api/accounts/000000000000000000000000
  **Header:** Authorization: Bearer {{auth_token}}
  **Respuesta esperada:** Status 404 Not Found
  **Importancia:** Manejo correcto de recursos inexistentes — el sistema no debe exponer información sobre cuentas que no existen.
url: "{{base_url}}/api/accounts/000000000000000000000000"
method: GET
headers:
  Authorization: Bearer {{auth_token}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 404", function () {
          pm.response.to.have.status(404);
      });
    language: text/javascript
order: 6000
