$kind: http-request
name: "PRUEBA-01-05: Login body vacío - Negative"
description: |-
  Intento de login con un body JSON vacío (sin username ni password). El sistema debe validar la presencia de campos obligatorios y retornar error de validación.

  **Endpoint:** POST /api/auth/login
  **Body:** {}
  **Respuesta esperada:** Status 400 Bad Request o 422 Unprocessable Entity
  **Importancia:** Validación de entrada — el sistema debe rechazar requests malformados.
url: "{{base_url}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: "{}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 400 or 422", function () {
          pm.expect(pm.response.code).to.be.oneOf([400, 422]);
      });
    language: text/javascript
order: 5000
