$kind: http-request
name: "PRUEBA-02-05: Consultar cliente inexistente - Negative"
description: |-
  Intenta consultar un cliente con un ID que no existe en el sistema. Debe retornar 404 Not Found.

  **Endpoint:** GET /api/customers/000000000000000000000000
  **Header:** Authorization: Bearer {{auth_token}}
  **Respuesta esperada:** Status 404 Not Found
  **Importancia:** Manejo correcto de recursos inexistentes — el sistema no debe retornar 200 con datos nulos.
url: "{{base_url}}/api/customers/000000000000000000000000"
method: GET
headers:
  Authorization: Bearer {{auth_token}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 404", function () {
          pm.response.to.have.status(404);
      });
    language: text/javascript
order: 5000
